   <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <div class="wrapper">
        <header>
            <h1>Embedding Things</h1>
        </header>
        <main>
            <!-- ai prompt: inside the main add a section with h3 and two paragraphs about snow -->
            <section>
                <h3>Snow</h3>
                <p>Snow is made of tiny ice crystals that form in clouds when water vapor freezes around particles in the air.</p>
                <p>Each snowflake has a unique, intricate shape, and fresh snow can transform landscapes into bright, sparkling winter scenes.</p>
            </section>

            <section>
                <!-- embeding vids from youtube -->
                 <iframe width="560" height="315" src="https://www.youtube.com/embed/qk6MeIXsUeU?si=vkj4mA_TF9Nkw0_R" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                 <!-- embeding google map -->

            </section>
